name: Correct an existing entry
description: Report an incorrect tag, missing link, typo, or metadata issue.
title: "[Correction]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping keep the survey list accurate. Please point us to the existing entry and describe the correction clearly.

  - type: input
    id: paper_title
    attributes:
      label: Existing paper title
      description: The title as it appears on the website.
      placeholder: "Texture Fields: Learning Texture Representations in Function Space"
    validations:
      required: true

  - type: input
    id: paper_url
    attributes:
      label: Entry or paper URL
      description: Optional. Link to the listed paper, project page, or website entry if convenient.
      placeholder: https://...

  - type: dropdown
    id: correction_type
    attributes:
      label: What needs correction?
      multiple: true
      options:
        - Title / authors / venue / year
        - Paper / project / code link
        - Model Type
        - Guidance
        - Training Strategy
        - Generation Strategy
        - Texture Type
        - Missing paper
        - Duplicate entry
        - Other
    validations:
      required: true

  - type: textarea
    id: current_value
    attributes:
      label: Current value
      description: What currently appears to be wrong or incomplete?
      placeholder: The entry is currently tagged as Diffusion (2D), but the method operates directly on UV maps.
    validations:
      required: true

  - type: textarea
    id: proposed_value
    attributes:
      label: Proposed correction
      description: What should it be changed to?
      placeholder: Model Type should be Diffusion (UV).
    validations:
      required: true

  - type: textarea
    id: source
    attributes:
      label: Source or evidence
      description: Please include a paper section, project page, code link, or other reference supporting the correction.
      placeholder: The method description in Section 3 states that...
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Additional notes
      description: Optional.

  - type: checkboxes
    id: confirmation
    attributes:
      label: Checklist
      options:
        - label: I understand that maintainers may adjust wording or taxonomy labels for consistency.
          required: true
